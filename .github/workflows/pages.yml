name: Publier sur GitHub Pages

# Le jeu (index.pck, plus de 100 Mo) ne tient pas dans git : chaque Release porte l'export Web
# de Godot en ilot-web.zip ; cette Action le déballe et le publie sur Pages.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release à publier (vide : la dernière)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Télécharger l'export de la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p ilot-web.zip
          else gh release download -R "$GITHUB_REPOSITORY" -p ilot-web.zip; fi
          mkdir site && unzip -q ilot-web.zip -d site && ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
